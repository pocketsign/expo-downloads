plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'jp.co.pocketsign.expo.downloads'
version = '0.0.0'

android {
  namespace "jp.co.pocketsign.expo.downloads"
  defaultConfig {
    versionCode 1
    versionName "0.0.0"
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    unitTests.all {
      useJUnitPlatform()
    }
  }
}

dependencies {
  testImplementation "org.jetbrains.kotlin:kotlin-test-junit5"
}
