# GitHub Actions ワークフローの静的解析(zizmor)と、ワークフローロックファイル(.github/workflows/actions.lock)の検証。
# zizmor はアクションの未固定、過剰な権限、テンプレート展開によるコード注入、資格情報の残留などを検出する。
# gh actions-lock --verify は、ロックファイルがワークフローの参照をすべて覆っていること、
# 固定したコミットが参照元のタグ・ブランチから今も到達できることを確かめる。
#
# ワークフローを変更した PR / main push で検査するほか、利用中のアクションに後から脆弱性が公開されたり、
# タグが付け替えられたりすることがあるため、毎日定期実行する。
# 定期実行が失敗したときは Issue を作成(既存の未クローズ Issue があればコメント)する。
name: Workflow Scan

on:
  push:
    branches:
      - main
    paths:
      - '.github/**'
      - 'zizmor.yml'
  pull_request:
    paths:
      - '.github/**'
      - 'zizmor.yml'
  schedule:
    # 毎日 9:00 JST(00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.9.2
        with:
          inputs: .github
          version: 1.33.1
          # code scanning(SARIF のアップロード)は使わず、検出は注釈とログに出してジョブを失敗させる
          advanced-security: false
          annotations: true

  actions-lock:
    name: actions-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.5.1
      - name: Verify lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify

  notify-scheduled-failure:
    name: Notify scheduled failure
    needs: [zizmor, actions-lock]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or update issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="ワークフローの静的解析(定期実行)で問題が検出されました"
          body=$(printf '%s\n\n%s\n\n%s' \
            "定期実行の zizmor またはワークフローロックファイルの検証が失敗しました。ジョブのログで検出内容を確認してください。" \
            "- 実行結果: ${RUN_URL}" \
            "zizmor の検出を意図した構成で解消できない場合は、理由を添えた行内コメント(# zizmor: ignore[監査名])か zizmor.yml で除外できます。ロックファイルの検証失敗は gh actions-lock(タグ付け替えの追従は --relock)で更新します。")
          # 全文検索は日本語・記号を含むタイトルで取りこぼす恐れがあるため、未クローズ Issue を列挙して完全一致で探す
          number=$(gh issue list --state open --limit 200 --json number,title \
            | jq -r --arg title "${title}" 'map(select(.title == $title)) | .[0].number // empty')
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi
