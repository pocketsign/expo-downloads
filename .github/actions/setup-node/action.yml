name: Setup Node.js
description: Prepare and install everything for Node.js

inputs:
  node-version:
    description: Version of Node to use
    default: 22.x

  npm-registry-url:
    description: npm registry url
    default: ""

# 中で使う action は、このアクションを `$/` で参照するワークフローの actions.lock で固定される。
# zizmor は composite action を単体で検査して未固定と判定するため、unpinned-uses を行ごとに無視している
# (composite action の lock の扱いは github/gh-actions-lock#183 で議論中)。
runs:
  using: composite
  steps:
    - name: 🏗 Setup pnpm
      uses: pnpm/action-setup@v6.1.1 # zizmor: ignore[unpinned-uses]

    - name: 🏗 Setup Node
      uses: actions/setup-node@v7.1.0 # zizmor: ignore[unpinned-uses]
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        registry-url: ${{ inputs.npm-registry-url }}

    - name: 📦 Install dependencies
      run: pnpm install
      shell: bash

    - name: 📦 Install dependencies (example)
      run: pnpm install
      shell: bash
      working-directory: example
